<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Soft light glass wallpaper">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.46" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="cyan" cx="18%" cy="18%" r="48%">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="82%" cy="24%" r="46%">
      <stop offset="0" stop-color="#fecdd3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fecdd3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="82%" r="52%">
      <stop offset="0" stop-color="#ddd6fe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ddd6fe" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#cyan)"/>
  <rect width="1920" height="1080" fill="url(#rose)"/>
  <rect width="1920" height="1080" fill="url(#violet)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.34"/>
</svg>
