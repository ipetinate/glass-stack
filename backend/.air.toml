root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/glassd ./cmd/glassd"
entrypoint = ["./tmp/glassd"]
include_ext = ["go"]
exclude_dir = ["tmp", "vendor"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
startup_banner = ""
